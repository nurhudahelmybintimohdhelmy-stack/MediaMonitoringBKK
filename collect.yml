name: Collect social media data
on:
  schedule: [{cron: "*/15 * * * *"}]   # every 15 min (GitHub may delay runs)
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r collector/requirements.txt
      - run: python collector/collect.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ secrets.X_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_NEW_POSTS: ${{ vars.NOTIFY_NEW_POSTS }}
          ALERT_MIN_NEG: ${{ vars.ALERT_MIN_NEG }}
          ALERT_NEG_PCT: ${{ vars.ALERT_NEG_PCT }}
      - run: |
          git config user.name "monitor-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data/posts.json
          git diff --cached --quiet || (git commit -m "data update" && git push)
